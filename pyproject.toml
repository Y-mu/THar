[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "langhar-intent-orchestrator"
version = "0.1.0"
description = "An intent-first LangChain agent development scaffold for server-side applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["agent", "fastapi", "langchain", "llm", "sse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115,<1",
    "langchain>=1.4,<2",
    "langchain-huggingface>=0.3,<1",
    "langchain-openai>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "sentence-transformers>=3,<6",
    "sse-starlette>=3,<4",
    "typesafe-sdk>=0.7,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["langHar*"]
